name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile check
        run: python -m compileall app.py label_date_generator tests

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "配料表日期生成器" app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: 配料表日期生成器-windows
          path: dist/配料表日期生成器.exe
